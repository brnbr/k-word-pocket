spring.application.name=k-word-pocket

# --- Datasource (Docker MySQL 연동) ---
spring.datasource.url=jdbc:mysql://localhost:3306/kword_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# data.sql을 Hibernate 테이블 생성 이후에 실행
spring.jpa.defer-datasource-initialization=true
