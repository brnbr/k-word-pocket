<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>K-Word Pocket | 플래시카드 데모</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F9FAFB;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: var(--primary); }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        .btn-secondary {
            background: #10B981;
        }
        .btn-secondary:hover { background: #059669; }

        /* 플래시카드 그리드 및 3D 플립 효과 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .flip-card {
            background-color: transparent;
            height: 140px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        .card-front {
            background-color: #EEF2FF;
            color: #312E81;
            border: 2px solid #C7D2FE;
        }
        .card-back {
            background-color: #FEF3C7;
            color: #92400E;
            transform: rotateY(180deg);
            border: 2px solid #FDE68A;
        }
        .card-badge {
            font-size: 11px;
            padding: 2px 6px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .card-text { font-size: 18px; font-weight: bold; }

        /* 인쇄(Print) 전용 레이아웃 */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .panel { box-shadow: none; border: none; padding: 0; }
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .flip-card { height: 100px; page-break-inside: avoid; }
            .flip-card-inner { transform: none !important; }
            .card-front {
                position: relative;
                border: 1px dashed #333;
                background: white !important;
                color: black !important;
            }
            .card-back { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 단어장(Deck) 생성 영역 -->
    <div class="panel no-print">
        <h2>1. 단어장(Deck) 생성</h2>
        <div class="input-group">
            <input type="text" id="deckName" placeholder="단어장 이름 (예: 외국인 필수 한국어)">
            <button onclick="createDeck()">단어장 생성</button>
        </div>
        <p id="deckStatus" style="font-size: 13px; color: #6B7280; margin: 0;">현재 선택된 단어장: 없음</p>
    </div>

    <!-- 2. 카드(Card) 추가 영역 -->
    <div class="panel no-print" id="cardPanel" style="opacity: 0.5; pointer-events: none;">
        <h2>2. 카드(Card) 추가</h2>
        <div class="input-group">
            <input type="text" id="cardFront" placeholder="앞면 (한국어 단어: 예: 안녕하세요)">
            <input type="text" id="cardBack" placeholder="뒷면 (영어/뜻: 예: Hello)">
            <button onclick="createCard()">카드 추가</button>
        </div>
    </div>

    <!-- 3. 실시간 플래시카드 뷰 & 인쇄 버튼 -->
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center;" class="no-print">
            <h2>3. 플래시카드 목록 (카드를 클릭하면 뒤집어집니다)</h2>
            <button class="btn-secondary" onclick="window.print()">🖨️ 인쇄하기</button>
        </div>
        <div class="card-grid" id="cardGrid">
            <!-- 동적으로 카드가 추가되는 영역 -->
        </div>
    </div>
</div>

<script>
    let currentDeckId = null;

    // 1. 단어장 생성 API 호출 (POST /decks)
    async function createDeck() {
        const name = document.getElementById('deckName').value.trim();
        if (!name) return alert('단어장 이름을 입력해주세요.');

        try {
            const res = await fetch('/decks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await res.json();

            currentDeckId = data.id;
            document.getElementById('deckStatus').innerHTML = `✅ 활성화된 단어장: <b>${data.name} (ID: ${data.id})</b>`;
            document.getElementById('cardPanel').style.opacity = '1';
            document.getElementById('cardPanel').style.pointerEvents = 'auto';
            alert(`단어장 "${data.name}"이(가) 생성되었습니다!`);
        } catch (err) {
            console.error(err);
            alert('백엔드 서버와 통신 실패 (서버가 켜져 있는지 확인해주세요)');
        }
    }

    // 2. 카드 생성 API 호출 (POST /cards)
    async function createCard() {
        const front = document.getElementById('cardFront').value.trim();
        const back = document.getElementById('cardBack').value.trim();
        if (!front || !back) return alert('앞면과 뒷면 내용을 모두 입력해주세요.');

        try {
            const res = await fetch('/cards', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    deckId: currentDeckId,
                    front: front,
                    back: back
                })
            });
            const data = await res.json();

            addCardToUI(data.front, data.back);
            document.getElementById('cardFront').value = '';
            document.getElementById('cardBack').value = '';
        } catch (err) {
            console.error(err);
            alert('카드 추가 실패');
        }
    }

    // 화면에 3D 플립 카드 렌더링
    function addCardToUI(front, back) {
        const grid = document.getElementById('cardGrid');
        const cardEl = document.createElement('div');
        cardEl.className = 'flip-card';
        cardEl.onclick = () => cardEl.classList.toggle('is-flipped');

        cardEl.innerHTML = `
      <div class="flip-card-inner">
        <div class="card-front">
          <span class="card-badge">🇰🇷 FRONT (한국어)</span>
          <div class="card-text">${front}</div>
        </div>
        <div class="card-back">
          <span class="card-badge">🇺🇸 BACK (Meaning)</span>
          <div class="card-text">${back}</div>
        </div>
      </div>
    `;
        grid.appendChild(cardEl);
    }
</script>

</body>
</html>
